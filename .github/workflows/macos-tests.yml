name: macos-tests

# Testes e typecheck do cliente macOS (golive-gui-mac/) em PRs e pushes que o tocam.
on:
  pull_request:
    paths:
      - 'golive-gui-mac/**'
      - 'tools/proton-confgen/**'
      - '.github/workflows/macos-tests.yml'
      - '.github/workflows/release-macos.yml'
  push:
    branches: [main]
    paths:
      - 'golive-gui-mac/**'
      - 'tools/proton-confgen/**'
      - '.github/workflows/macos-tests.yml'
      - '.github/workflows/release-macos.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: golive-gui-mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Garante que o proton-confgen compila da fonte e bate com o manifesto
      - run: npm run build:proton
